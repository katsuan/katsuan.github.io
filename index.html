<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --text: #e6e6e6;
    --muted: #9aa0a6;
    --accent: #5b8cff;
    --border: #2a2e37;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    padding: 4rem 1.5rem 2rem;
    text-align: center;
  }
  header h1 {
    margin: 0 0 0.5rem;
    font-size: 2.2rem;
  }
  header p {
    color: var(--muted);
    margin: 0;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 1rem 1.5rem 4rem;
  }
  section {
    margin-bottom: 3rem;
  }
  section h2 {
    font-size: 1.3rem;
    border-left: 4px solid var(--accent);
    padding-left: 0.6rem;
    margin-bottom: 1rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.2rem;
  }
  .card h3 {
    margin: 0 0 0.4rem;
    font-size: 1.05rem;
  }
  .card p {
    color: var(--muted);
    margin: 0 0 0.8rem;
    font-size: 0.92rem;
  }
  .card a {
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
  }
  .card a:hover {
    text-decoration: underline;
  }
  .tool-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1.4rem;
  }
  .tool-box a.btn {
    display: inline-block;
    margin-top: 0.8rem;
    padding: 0.6rem 1.2rem;
    background: var(--accent);
    color: #fff;
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.9rem;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 2rem 0;
  }
</style>
</head>
<body>

<header>
  <h1>Portfolio</h1>
  <p>制作物とツールの一覧</p>
</header>

<main>
  <section>
    <h2>作品</h2>
    <div class="grid">
      <div class="card">
        <h3>準備中</h3>
        <p>ここに作品カードを追加していきます。</p>
      </div>
    </div>
  </section>

  <section>
    <h2>ツール</h2>
    <div class="tool-box">
      <h3>backup_and_delete.bat</h3>
      <p>
        Windows用の補助ツールです。ファイルやフォルダをこの .bat の
        アイコンにドラッグ&amp;ドロップすると、同じ階層の
        <code>backup</code> フォルダにコピーしてから元のファイル/フォルダを削除します。
      </p>
      <a class="btn" href="tools/backup_and_delete.bat" download>ダウンロード</a>
    </div>
  </section>
</main>

<footer>
  &copy; 2026
</footer>

</body>
</html>
